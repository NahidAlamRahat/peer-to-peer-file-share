<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
    content="PeerTransfer — Secure, fast, peer-to-peer file sharing. No file size limit. No middleman. Fully encrypted.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PeerTransfer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>PeerTransfer</title>
  <link rel="manifest" href="manifest.json">
</head>

<body style="background-color: #0F172A; margin: 0; padding: 0;">
  <div id="loading-container"
    style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; z-index: 1000; background-color: #0F172A; transition: opacity 0.5s ease-out;">
    <div
      style="width: 50px; height: 50px; border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;">
    </div>
    <div
      style="margin-top: 20px; color: #94a3b8; font-family: sans-serif; font-size: 16px; font-weight: 500; letter-spacing: 0.5px;">
      Loading PeerTransfer...</div>
  </div>


  <style>
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
  <script>
    window.addEventListener('load', function () {
      // 1. Detect Facebook/Messenger/Instagram In-App Browser
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isFbOrIg = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);

      if (isFbOrIg) {
        const loader = document.getElementById('loading-container');
        if (loader) {
          loader.innerHTML = `
            <div style="padding: 30px; text-align: center; max-width: 400px;">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 20px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
              <h2 style="color: white; margin-bottom: 10px; font-family: sans-serif;">Unsupported Browser</h2>
              <p style="color: #94a3b8; line-height: 1.5; font-family: sans-serif; font-size: 16px;">
                Messenger and Instagram browsers do not support the features required for this app.
              </p>
              <div style="margin-top: 30px; background-color: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; padding: 15px; border-radius: 8px;">
                <p style="color: #60a5fa; margin: 0; font-family: sans-serif; font-weight: bold;">
                  Tap the 3 dots (⋮) at the top right<br>and select "Open in Browser"
                </p>
              </div>
            </div>
          `;
          // We stop here and do not load Flutter because it will crash anyway
          return;
        }
      }

      // 2. Normal Flutter Initialization
      function injectAdsterraAds() {
        // Social Bar
        var sBar = document.createElement('script');
        sBar.src = 'https://pl29583442.effectivecpmnetwork.com/a1/06/ed/a106edc96e107a31cce7dce81eb16742.js';
        document.body.appendChild(sBar);

        // Native Banner (Styled to only show 1 block and stay small)
        var nContainer = document.createElement('div');
        nContainer.id = 'container-94e1bddb3e559fe0d5fcd01f8f538a82';
        nContainer.style.position = 'fixed';
        nContainer.style.bottom = '20px';
        nContainer.style.right = '20px';
        nContainer.style.width = '300px';  // Limits to 1 ad block!
        nContainer.style.maxWidth = '90vw';
        nContainer.style.zIndex = '99999';
        nContainer.style.backgroundColor = 'white';
        nContainer.style.borderRadius = '8px';
        nContainer.style.boxShadow = '0 4px 6px rgba(0,0,0,0.3)';
        
        // Add a close button to Native Banner so users can hide it
        var closeBtn = document.createElement('div');
        closeBtn.innerHTML = '×';
        closeBtn.style.position = 'absolute';
        closeBtn.style.top = '0px';
        closeBtn.style.right = '5px';
        closeBtn.style.cursor = 'pointer';
        closeBtn.style.fontSize = '20px';
        closeBtn.style.color = 'black';
        closeBtn.style.fontWeight = 'bold';
        closeBtn.style.zIndex = '100000';
        closeBtn.onclick = function() { nContainer.style.display = 'none'; };
        nContainer.appendChild(closeBtn);

        document.body.appendChild(nContainer);
        var nScript = document.createElement('script');
        nScript.async = true;
        nScript.dataset.cfasync = 'false';
        nScript.src = 'https://pl29583441.effectivecpmnetwork.com/94e1bddb3e559fe0d5fcd01f8f538a82/invoke.js';
        document.body.appendChild(nScript);

        // Popunder
        try {
          var KEY = 'pt_pop_ts';
          var INTERVAL = 6 * 60 * 60 * 1000;
          var last = localStorage.getItem(KEY);
          var now = Date.now();
          if (!last || (now - parseInt(last, 10)) > INTERVAL) {
            localStorage.setItem(KEY, now);
            var pScript = document.createElement('script');
            pScript.src = 'https://pl29583440.effectivecpmnetwork.com/d3/72/3b/d3723b40affae7bdf83b03e797bc5d14.js';
            document.head.appendChild(pScript);
          }
        } catch (e) {}
      }

      const observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          if (mutation.addedNodes.length > 0) {
            for (let i = 0; i < mutation.addedNodes.length; i++) {
              if (mutation.addedNodes[i].tagName === 'FLUTTER-VIEW') {
                const loader = document.getElementById('loading-container');
                if (loader) {
                  loader.style.opacity = '0';
                  setTimeout(() => loader.remove(), 500);
                }
                observer.disconnect();

                // Delay Adsterra injection until Splash Screen is done (~3.5 seconds)
                setTimeout(injectAdsterraAds, 3500);
              }
            }
          }
        });
      });
      observer.observe(document.body, { childList: true });

      // Fallback if Flutter throws an error during initialization (e.g., WebGL error)
      window.addEventListener('error', function (e) {
        const loader = document.getElementById('loading-container');
        if (loader && document.querySelector('flutter-view') == null) {
          loader.innerHTML = `
            <div style="padding: 20px; text-align: center;">
              <h2 style="color: white; font-family: sans-serif;">Application Error</h2>
              <p style="color: #94a3b8; font-family: sans-serif;">Your browser might not support WebGL, or an error occurred during loading.</p>
              <p style="color: #94a3b8; font-family: sans-serif;">Please try opening this link in Chrome or Safari.</p>
            </div>
          `;
        }
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
