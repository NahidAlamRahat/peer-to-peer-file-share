<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PeerTransfer Link — Secure, fast, peer-to-peer file sharing. No file size limit. No middleman. Fully encrypted.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PeerTransfer Link">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PeerTransfer Link</title>
  <link rel="manifest" href="manifest.json">

  <!--
    ══════════════════════════════════════════════════════════════════════════
    Google AdSense — PeerTransfer Link
    Publisher ID : ca-pub-7101476702170948
    ══════════════════════════════════════════════════════════════════════════
  -->
  <!-- This meta tag is required for AdSense Site Verification -->
  <meta name="google-adsense-account" content="ca-pub-7101476702170948">

  <script>
    // ── AdSense loader (called from Dart when ads_enabled = true) ───────────
    window.adsenseLoaded = false;

    window.loadAdSense = function () {
      if (window.adsenseLoaded) return; // prevent double-loading
      window.adsenseLoaded = true;

      // Inject the AdSense auto-ads script
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7101476702170948';
      script.setAttribute('crossorigin', 'anonymous');
      document.head.appendChild(script);

      script.onload = function () {
        // Push auto-ads config once script is loaded
        try {
          (window.adsbygoogle = window.adsbygoogle || []).push({
            google_ad_client: 'ca-pub-7101476702170948',
            enable_page_level_ads: true,   // Auto-ads: Google finds best spots
            overlays: { bottom: true },    // Anchor ad at bottom of page
          });
          console.log('✅ AdSense auto-ads loaded.');
        } catch (e) {
          console.warn('⚠️ AdSense push error:', e);
        }
      };
    };

    // ── Called from Dart to disable / unload AdSense ─────────────────────────
    window.unloadAdSense = function () {
      // Remove any injected adsbygoogle scripts
      document.querySelectorAll('script[src*="adsbygoogle"]').forEach(function (s) {
        s.remove();
      });
      // Remove any ad iframes
      document.querySelectorAll('ins.adsbygoogle').forEach(function (ins) {
        ins.remove();
      });
      window.adsenseLoaded = false;
      console.log('🔇 AdSense unloaded.');
    };
  </script>
</head>
<body style="background-color: #0F172A; margin: 0; padding: 0;">
  <div id="loading-container" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; z-index: 1000; background-color: #0F172A; transition: opacity 0.5s ease-out;">
    <div style="width: 50px; height: 50px; border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    <div style="margin-top: 20px; color: #94a3b8; font-family: sans-serif; font-size: 16px; font-weight: 500; letter-spacing: 0.5px;">Loading PeerTransfer...</div>
  </div>
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    window.addEventListener('load', function() {
      // 1. Detect Facebook/Messenger/Instagram In-App Browser
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isFbOrIg = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);

      if (isFbOrIg) {
        const loader = document.getElementById('loading-container');
        if (loader) {
          loader.innerHTML = `
            <div style="padding: 30px; text-align: center; max-width: 400px;">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 20px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
              <h2 style="color: white; margin-bottom: 10px; font-family: sans-serif;">Unsupported Browser</h2>
              <p style="color: #94a3b8; line-height: 1.5; font-family: sans-serif; font-size: 16px;">
                Messenger and Instagram browsers do not support the features required for this app.
              </p>
              <div style="margin-top: 30px; background-color: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; padding: 15px; border-radius: 8px;">
                <p style="color: #60a5fa; margin: 0; font-family: sans-serif; font-weight: bold;">
                  Tap the 3 dots (⋮) at the top right<br>and select "Open in Browser"
                </p>
              </div>
            </div>
          `;
          // We stop here and do not load Flutter because it will crash anyway
          return;
        }
      }

      // 2. Normal Flutter Initialization
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.addedNodes.length > 0) {
            for (let i = 0; i < mutation.addedNodes.length; i++) {
              if (mutation.addedNodes[i].tagName === 'FLUTTER-VIEW') {
                const loader = document.getElementById('loading-container');
                if (loader) {
                  loader.style.opacity = '0';
                  setTimeout(() => loader.remove(), 500);
                }
                observer.disconnect();
              }
            }
          }
        });
      });
      observer.observe(document.body, { childList: true });
      
      // Fallback if Flutter throws an error during initialization (e.g., WebGL error)
      window.addEventListener('error', function(e) {
        const loader = document.getElementById('loading-container');
        if (loader && document.querySelector('flutter-view') == null) {
          loader.innerHTML = `
            <div style="padding: 20px; text-align: center;">
              <h2 style="color: white; font-family: sans-serif;">Application Error</h2>
              <p style="color: #94a3b8; font-family: sans-serif;">Your browser might not support WebGL, or an error occurred during loading.</p>
              <p style="color: #94a3b8; font-family: sans-serif;">Please try opening this link in Chrome or Safari.</p>
            </div>
          `;
        }
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
