<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
    content="PeerTransfer — Secure, fast, peer-to-peer file sharing. No file size limit. No middleman. Fully encrypted.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PeerTransfer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=3">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=3" />

  <title>PeerTransfer</title>
  <style>
    :root {
      --bg-color: #F8F9FA;
      --heading-color: #1A1A1A;
      --text-color: #4A5568;
      --spinner-track: rgba(0, 0, 0, 0.1);
      --spinner-accent: #3b82f6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0F172A;
        --heading-color: #FFFFFF;
        --text-color: #94A3B8;
        --spinner-track: rgba(255, 255, 255, 0.1);
        --spinner-accent: #3b82f6;
      }
    }

    body {
      background-color: var(--bg-color);
      margin: 0;
      padding: 0;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1000;
      background-color: var(--bg-color);
      transition: opacity 0.5s ease-out;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--spinner-track);
      border-left-color: var(--spinner-accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      margin-top: 20px;
      color: var(--text-color);
      font-family: sans-serif;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7101476702170948"
    crossorigin="anonymous"></script>

  <link rel="manifest" href="manifest.json">
</head>

<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">Loading PeerTransfer...</div>
  </div>
  <script>
    window.addEventListener('load', function () {
      // 1. Detect Facebook/Messenger/Instagram In-App Browser
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isFbOrIg = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);

      if (isFbOrIg) {
        const loader = document.getElementById('loading-container');
        if (loader) {
          loader.innerHTML = `
            <div style="padding: 30px; text-align: center; max-width: 400px;">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 20px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
              <h2 style="color: var(--heading-color); margin-bottom: 10px; font-family: sans-serif;">Unsupported Browser</h2>
              <p style="color: var(--text-color); line-height: 1.5; font-family: sans-serif; font-size: 16px;">
                Messenger and Instagram browsers do not support the features required for this app.
              </p>
              <div style="margin-top: 30px; background-color: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; padding: 15px; border-radius: 8px;">
                <p style="color: #60a5fa; margin: 0; font-family: sans-serif; font-weight: bold;">
                  Tap the 3 dots (⋮) at the top right<br>and select "Open in Browser"
                </p>
              </div>
            </div>
          `;
          // We stop here and do not load Flutter because it will crash anyway
          return;
        }
      }

      // 2. Normal Flutter Initialization
      const observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          if (mutation.addedNodes.length > 0) {
            for (let i = 0; i < mutation.addedNodes.length; i++) {
              if (mutation.addedNodes[i].tagName === 'FLUTTER-VIEW') {
                const loader = document.getElementById('loading-container');
                if (loader) {
                  loader.style.opacity = '0';
                  setTimeout(() => loader.remove(), 500);
                }
                observer.disconnect();

                // Inject Adsterra Social Bar Ads ONLY AFTER Flutter is loaded
                setTimeout(function() {
                  var adScript = document.createElement('script');
                  adScript.type = 'text/javascript';
                  adScript.async = true;
                  adScript.src = 'https://onionclose.com/a1/06/ed/a106edc96e107a31cce7dce81eb16742.js';
                  document.body.appendChild(adScript);
                }, 1000); // 1-second delay so the Home Screen renders fully before ad loads

              }
            }
          }
        });
      });
      observer.observe(document.body, { childList: true });

      // Fallback if Flutter throws an error during initialization (e.g., WebGL error)
      window.addEventListener('error', function (e) {
        const loader = document.getElementById('loading-container');
        if (loader && document.querySelector('flutter-view') == null) {
          loader.innerHTML = `
            <div style="padding: 20px; text-align: center;">
              <h2 style="color: var(--heading-color); font-family: sans-serif;">Application Error</h2>
              <p style="color: var(--text-color); font-family: sans-serif;">Your browser might not support WebGL, or an error occurred during loading.</p>
              <p style="color: var(--text-color); font-family: sans-serif;">Please try opening this link in Chrome or Safari.</p>
            </div>
          `;
        }
      });
    });
  </script>
  <script>
    // Helper called from Dart to trigger a file download via Service Worker stream.
    // Flutter Web registers a click listener on the document that intercepts anchor clicks
    // and pushes them to Flutter's router. We bypass this by dispatching a MouseEvent
    // with bubbles:false — the browser still performs the default download action,
    // but the event never propagates up to Flutter's document-level listener.
    window.triggerP2PDownload = function (url, filename) {
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      // bubbles: false prevents Flutter's document-level router from intercepting
      var evt = new MouseEvent('click', {
        bubbles: false,
        cancelable: true,
        view: window
      });
      a.dispatchEvent(evt);
      setTimeout(function () { document.body.removeChild(a); }, 1000);
    };

    // Helper to detect Chrome Incognito mode.
    window.checkIncognito = function (callback) {
      if (window.incognitoPromise) {
        window.incognitoPromise.then(callback);
      } else {
        callback(false);
      }
    };
  </script>
  <script src="detectIncognito.min.js"></script>
  <script>
    window.isIncognitoMode = false;
    window.incognitoPromise = new Promise(function (resolve) {
      if (typeof detectIncognito !== 'undefined') {
        detectIncognito().then(function (result) {
          window.isIncognitoMode = result.isPrivate;
          resolve(result.isPrivate);
        });
      } else {
        resolve(false);
      }
    });
  </script>
  <script>
    // Register SW in the background — does NOT block Flutter from booting.
    // By the time the user scans QR and connects (~10-30 s), the SW will be
    // active and ready. file_transfer_web.dart retries for up to 5 s if needed.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          console.log('[SW] Registered:', reg.scope);
        }, function (err) {
          console.error('[SW] Registration failed:', err);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
