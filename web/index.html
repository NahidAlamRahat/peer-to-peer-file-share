<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PeerTransfer Link — Secure, fast, peer-to-peer file sharing. No file size limit. No middleman. Fully encrypted.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PeerTransfer Link">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PeerTransfer Link</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #0F172A; margin: 0; padding: 0;">
  <div id="loading-container" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; z-index: 1000; background-color: #0F172A; transition: opacity 0.5s ease-out;">
    <div style="width: 50px; height: 50px; border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    <div style="margin-top: 20px; color: #94a3b8; font-family: sans-serif; font-size: 16px; font-weight: 500; letter-spacing: 0.5px;">Loading PeerTransfer...</div>
  </div>
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Set a timeout to remove the loading container if Flutter initialization fails or takes too long
    // But usually, we can hook into Flutter's initialization. Since Flutter 3.22+, flutter_bootstrap.js is used.
    window.addEventListener('load', function() {
      // The flutter_bootstrap.js will append the flutter view.
      // We can use a MutationObserver to hide the loader once the flutter view is added.
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.addedNodes.length > 0) {
            for (let i = 0; i < mutation.addedNodes.length; i++) {
              if (mutation.addedNodes[i].tagName === 'FLUTTER-VIEW') {
                const loader = document.getElementById('loading-container');
                if (loader) {
                  loader.style.opacity = '0';
                  setTimeout(() => loader.remove(), 500);
                }
                observer.disconnect();
              }
            }
          }
        });
      });
      observer.observe(document.body, { childList: true });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
